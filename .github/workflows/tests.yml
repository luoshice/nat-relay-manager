name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Python source
        run: |
          if [ ! -s nrm.py ]; then
            base64 -d nrm.py.gz.b64 | gzip -dc > nrm.py
          fi
      - name: Python syntax
        run: python -m py_compile nrm.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n install.sh supervisor.sh
